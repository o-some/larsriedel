version: 1.2.0-candidate
live_motion_tiers: [MICRO, SECTION, NARRATIVE]
narrative_motion:
  - ambient_disc_orbit
  - discus_throw_trajectory
  - bounded_background_parallax
  - page_progress_indicator
  - mobile_section_sweep
  - mobile_bounded_depth
  - grouped_reveal_stagger
scroll_hijacking: forbidden
maximum_simultaneous_reveals: 6
default_tech: css_and_intersection_observer
target_fps: 60
reduced_motion: show_final_state_disable_continuous_orbit
mobile_downgrade: cap_depth_to_28px_use_transform_opacity_and_keep_native_scroll
mobile_effect_cap: one_section_sweep_plus_one_depth_layer_plus_visible_reveal_group
rendered_video: off
